<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fitness">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Lisa's Fitness Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
  button { font-family: inherit; cursor: pointer; }
  #header { background: linear-gradient(135deg,#1e293b,#0f172a); padding: 52px 16px 0; border-bottom: 1px solid #1e3a5f; position: sticky; top: 0; z-index: 10; }
  #header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(90deg,#38bdf8,#818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  #header p { font-size: 11px; color: #64748b; margin: 3px 0 12px; }
  #day-row { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; padding-bottom: 0; }
  #day-row::-webkit-scrollbar { display: none; }
  .day-btn { padding: 8px 11px; border: none; border-radius: 8px 8px 0 0; font-weight: 700; font-size: 11px; white-space: nowrap; background: transparent; color: #64748b; border-bottom: 3px solid transparent; transition: all 0.15s; }
  .day-btn.active { background: #1e40af; color: #fff; border-bottom-color: #38bdf8; }
  #tabs { display: flex; border-bottom: 2px solid #1e293b; background: #0f172a; position: sticky; top: 118px; z-index: 9; }
  .tab-btn { flex: 1; padding: 10px 4px; border: none; background: none; font-weight: 700; font-size: 11px; color: #475569; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s; }
  .tab-btn.active { color: #38bdf8; border-bottom-color: #38bdf8; }
  #content { padding: 0 14px 32px; }
  .card { background: #1e293b; border-radius: 14px; padding: 16px; margin-top: 14px; border: 1px solid #334155; }
  .card.highlight { border-color: #1e40af; }
  .lbl { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 4px; }
  .badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; display: inline-block; }
  .info-box { margin-top: 10px; padding: 10px 14px; background: #0f172a; border-radius: 8px; font-size: 12px; color: #94a3b8; line-height: 1.7; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .grid-cell { background: #0f172a; border-radius: 10px; padding: 12px; }
  .ex-row { background: #0f172a; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .pill-row { display: flex; gap: 4px; margin-top: 4px; }
  .pill { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #334155; background: transparent; color: #94a3b8; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .pill.done { border-color: #10b981; background: #10b98122; color: #10b981; }
  .macro-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; margin: 6px 0; }
  .macro-p { background: #8b5cf6; border-radius: 4px; }
  .macro-c { background: #f59e0b; border-radius: 4px; }
  .macro-f { background: #10b981; border-radius: 4px; }
  .macro-labels { display: flex; gap: 12px; font-size: 11px; }
  .ing-row { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; border-bottom: 1px solid #1e293b; }
  .ing-row:last-child { border-bottom: none; }
  .prep-note { margin: 6px 0; padding: 6px 10px; background: #0f172a; border-radius: 6px; font-size: 11px; color: #38bdf8; }
  .shop-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #1e293b; cursor: pointer; transition: opacity 0.15s; }
  .shop-item.checked { opacity: 0.35; }
  .shop-check { width: 20px; height: 20px; border-radius: 5px; border: 2px solid #334155; background: transparent; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; transition: all 0.15s; }
  .shop-check.checked { border-color: #10b981; background: #10b98133; color: #10b981; }
  .progress-bar-bg { height: 14px; border-radius: 7px; background: #0f172a; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg,#38bdf8,#818cf8); border-radius: 7px; transition: width 0.5s; }
  .weight-input { background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; padding: 8px 12px; font-size: 16px; width: 120px; }
  .btn-primary { background: #1d4ed8; border: none; border-radius: 8px; color: #fff; padding: 10px 16px; font-weight: 700; font-size: 13px; }
  .btn-success { background: #10b981; border: none; border-radius: 8px; color: #fff; padding: 10px 16px; font-weight: 700; font-size: 13px; }
  .btn-pill { padding: 7px 14px; border-radius: 20px; border: none; font-weight: 700; font-size: 12px; transition: all 0.15s; }
  #update-modal { display: none; position: fixed; inset: 0; background: #0f172acc; z-index: 100; align-items: flex-end; }
  #update-modal.open { display: flex; }
  #update-sheet { background: #1e293b; border-radius: 20px 20px 0 0; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); width: 100%; }
  #update-sheet h2 { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
  #update-sheet p { font-size: 13px; color: #94a3b8; margin-bottom: 14px; line-height: 1.6; }
  #update-textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: #e2e8f0; padding: 12px; font-size: 12px; font-family: monospace; height: 160px; resize: none; margin-bottom: 12px; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: 700; font-size: 14px; }
  #cancel-btn { background: #334155; color: #94a3b8; }
  #apply-btn { background: #1d4ed8; color: #fff; }
  .yoga-item { background: #0f172a; border-radius: 10px; padding: 10px 14px; display: flex; gap: 12px; margin-bottom: 8px; }
  .stat-card { background: #0f172a; border-radius: 10px; padding: 12px; }
  .stat-card .big { font-size: 24px; font-weight: 800; color: #38bdf8; }
  .week-badge { display:inline-block; background:#1e40af33; color:#60a5fa; border:1px solid #1e40af; border-radius:20px; font-size:11px; font-weight:700; padding:3px 10px; margin-bottom:10px; }
</style>
</head>
<body>

<div id="header">
  <h1>Lisa's Fitness Tracker</h1>
  <p id="header-sub">2 adults · 2 children · Goal: lose 1 stone 🎯</p>
  <div id="day-row"></div>
</div>

<div id="tabs">
  <button class="tab-btn active" data-tab="workout">🏋️ Workout</button>
  <button class="tab-btn" data-tab="meal">🍽️ Meals</button>
  <button class="tab-btn" data-tab="shop">🛒 Shopping</button>
  <button class="tab-btn" data-tab="progress">📈 Progress</button>
</div>

<div id="content"></div>

<div id="update-modal">
  <div id="update-sheet">
    <h2>📋 Paste new week's plan</h2>

      <button id="cancel-btn" onclick="closeModal()">Cancel</button>
      <button id="apply-btn" onclick="applyUpdate()">Apply update</button>
    </div>
  </div>
</div>

// ─── STATE ───────────────────────────────────────────────────────────────────
function getToday() {
  const d = new Date().getDay();
  return d === 0 ? 6 : d - 1;
}

function loadPlan() {
  // Use embedded plan if it's newer than what's stored
  try {
    const stored = localStorage.getItem('lisa_plan');
    if (!stored) { localStorage.setItem('lisa_plan', JSON.stringify(OVERRIDE_PLAN)); return OVERRIDE_PLAN; }
    const parsed = JSON.parse(stored);
    if (parsed.weekLabel !== OVERRIDE_PLAN.weekLabel) {
      localStorage.setItem('lisa_plan', JSON.stringify(OVERRIDE_PLAN));
      return OVERRIDE_PLAN;
    }
    return parsed;
  } catch { return OVERRIDE_PLAN; }
}
function loadProgress() {
  try { const p = localStorage.getItem('lisa_progress'); return p ? JSON.parse(p) : []; } catch { return []; }
}
function loadChecked() {
  try { const c = localStorage.getItem('lisa_checked'); return c ? JSON.parse(c) : {}; } catch { return {}; }
}
function savePlan()     { localStorage.setItem('lisa_plan', JSON.stringify(state.plan)); }
function saveProgress() { localStorage.setItem('lisa_progress', JSON.stringify(state.progressLog)); }
function saveChecked()  { localStorage.setItem('lisa_checked', JSON.stringify(state.checkedItems)); }

let state = {
  activeDay: DAYS[getToday()],
  tab: "workout",
  plan: loadPlan(),
  progressLog: loadProgress(),
  completedSets: {},
  checkedItems: loadChecked(),
  homeIdx: 0,
};

// ─── WORKOUT TYPE per day (fixed schedule) ──────────────────────────────────
const DAY_TYPE = {
  Monday:"run", Tuesday:"weights", Wednesday:"run",
  Thursday:"yoga", Friday:"weights", Saturday:"home", Sunday:"rest"
};

function getMealKey(day) {
  const nextDay = DAYS[(DAYS.indexOf(day)+1)%7];
  const t = DAY_TYPE[nextDay];
  return t === "run" ? "run" : t === "weights" ? "weights"
    : t === "yoga" ? "yoga" : t === "home" ? "home" : "rest";
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function badge(color, text) {
  return `<span class="badge" style="background:${color}22;color:${color}">${text}</span>`;
}
function macroBar(p, c, f) {
  const total = p*4 + c*4 + f*9 || 1;
  const pP = Math.round(p*4/total*100), pC = Math.round(c*4/total*100), pF = 100-pP-pC;
  return `<div class="macro-bar"><div class="macro-p" style="width:${pP}%"></div><div class="macro-c" style="width:${pC}%"></div><div class="macro-f" style="width:${pF}%"></div></div>
  <div class="macro-labels"><span style="color:#8b5cf6">P: ${p}g</span><span style="color:#f59e0b">C: ${c}g</span><span style="color:#10b981">F: ${f}g</span></div>`;
}

function buildShoppingList() {
  const cats = {
    "🥩 Meat & Fish":["pollo","muslo","salmon","salmón","cordero","ternera","cerdo","gambas","bacalao","merluza","lubina","dorada","mince","chicken","beef","lamb","pork","prawn","cod","fish"],
    "🥛 Dairy & Eggs":["egg","huevo","milk","leche","butter","mantequilla","yogur","yogurt","feta","cottage","queso","cheese","cream","nata","mozzarella"],
    "🥦 Fruit & Veg":["banana","plátano","berri","fresa","aguacate","avocado","brócoli","broccoli","espinaca","spinach","zanahoria","carrot","celery","apio","cebolla","onion","calabacín","courgette","pimiento","pepper","tomate","tomato","pepino","cucumber","manzana","apple","limón","lemon","espárrago","asparagus","chirivía","parsnip","calabaza","squash","jengibre","ginger","patata","potato","dátil","date","mango","ciruela"],
    "🍞 Bread & Grains":["oat","avena","pan","bread","pasta","arroz","rice","quinoa","noodle","pitta","pita","granola","oatcake","wrap","couscous","barra"],
    "🥫 Tins & Jars":["beans","judía","tomate frito","tomate en lata","chopped tomato","caldo","stock","leche de coco","coconut milk","curry","hummus","purée","concentrado","cerveza"],
    "🧴 Oils & Condiments":["aceite","olive oil","sesame","soja","soy","mayo","miel","honey","maple","peanut","almond butter","mantequilla de"],
    "🌿 Herbs & Spices":["ajo","garlic","jengibre","ginger","pimentón","paprika","chile","chilli","sal","salt","pimienta","pepper","hierba","herb","canela","cinnamon","comino","cumin","albahaca","basil","eneldo","dill","romero","rosemary","tomillo","thyme","laurel","bay","italian"],
    "🥜 Nuts & Seeds":["chia","lino","flaxseed","almond","almendra","seed","semilla","nut","nuez","piñon"],
  };

  const seen = new Set();
  const all = [];
  DAYS.forEach(day => {
    const key = getMealKey(day);
    const meal = state.plan.meals[key];
    ["breakfast","lunch","dinner"].forEach(t => {
      (meal[t]?.ingredients||[]).forEach(([item,qty]) => {
        const k = item.toLowerCase().replace(/[^a-z]/g,"").slice(0,10);
        if (!seen.has(k)) { seen.add(k); all.push({item,qty}); }
      });
    });
  });

  const grouped = {};
  [...Object.keys(cats),"🛒 Other"].forEach(c => grouped[c]=[]);
  all.forEach(({item,qty}) => {
    let matched = false;
    for (const [cat,kws] of Object.entries(cats)) {
      if (kws.some(kw => item.toLowerCase().includes(kw))) { grouped[cat].push({item,qty}); matched=true; break; }
    }
    if (!matched) grouped["🛒 Other"].push({item,qty});
  });
  return grouped;
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() { renderDayRow(); renderTabs(); renderContent(); }

function renderDayRow() {
  const today = DAYS[getToday()];
  document.getElementById('day-row').innerHTML = DAYS.map(d => {
    const t = DAY_TYPE[d];
    const icon = t==="run"?"🏃":t==="weights"?"🏋️":t==="yoga"?"🧘":t==="home"?"🏠":"😴";
    return `<button class="day-btn${d===state.activeDay?" active":""}" onclick="setDay('${d}')">${d.slice(0,3)} ${icon}</button>`;
  }).join('');
  document.getElementById('header-sub').textContent =
    `${state.plan.weekLabel || 'Week 1'} · Goal: lose 1 stone 🎯`;
}

function renderTabs() {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab===state.tab));
}

function renderContent() {
  const el = document.getElementById('content');
  if (state.tab==="workout") el.innerHTML = renderWorkout();
  else if (state.tab==="meal") el.innerHTML = renderMeals();
  else if (state.tab==="shop") el.innerHTML = renderShopping();
  else el.innerHTML = renderProgress();
  attachHandlers();
}

      <div style="border-left:3px solid ${c};padding-left:12px;margin-bottom:12px">
        <div style="font-size:10px;font-weight:800;color:${c};text-transform:uppercase;letter-spacing:1px">${lbl}</div>
        <div style="font-weight:800;font-size:16px;margin:4px 0">${data.name}</div>
        <div style="font-size:11px;color:#64748b">⏱ ${data.time} · ${data.cal} kcal</div>
        ${data.prepNote?`<div class="prep-note">📋 ${data.prepNote}</div>`:""}
        ${macroBar(data.protein,data.carbs,data.fat)}
      </div>
      <div class="lbl">Ingredients — ${serves}</div>
      ${data.ingredients.map(([item,qty])=>`<div class="ing-row"><span>${item}</span><span style="color:#64748b;font-weight:600">${qty}</span></div>`).join('')}
    </div>`;
  });

  html += `<div class="card">
    <div class="lbl">🍎 Snack</div>
    <div style="font-weight:700;font-size:14px;margin-top:4px">${m.snack.name}</div>
    <div style="font-size:12px;color:#64748b;margin-top:4px">${m.snack.cal} kcal · P: ${m.snack.protein}g · C: ${m.snack.carbs}g · F: ${m.snack.fat}g</div>
  </div>`;

  return html;
}

function renderShopping() {
  const grouped = buildShoppingList();
  let html = `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div><div class="lbl">Full week's groceries</div>
      <div style="font-size:16px;font-weight:800">Shopping List</div>
      <div style="font-size:12px;color:#64748b;margin-top:3px">All 7 days · tap to tick off</div></div>
      <button id="copy-btn" class="btn-primary" onclick="copyList()" style="font-size:12px;padding:9px 12px;flex-shrink:0">📋 Copy list</button>
    </div>
    <div style="margin-top:12px;padding:10px 12px;background:#1e40af22;border-radius:8px;font-size:12px;color:#93c5fd;line-height:1.6">
      📱 <strong>Add to iPhone:</strong> Tap "Copy list" → open <strong>Reminders</strong> → New list "Groceries" → paste. Each item will appear as a separate reminder.
    </div>
  </div>`;

  Object.entries(grouped).forEach(([cat,items])=>{
    if (!items.length) return;
    const doneCount = items.filter((_,i)=>state.checkedItems[`${cat}-${i}`]).length;
    html += `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div class="lbl">${cat}</div>
        <span style="font-size:11px;color:${doneCount===items.length?"#10b981":"#475569"}">${doneCount}/${items.length}</span>
      </div>
      ${items.map(({item,qty},i)=>{const k=`${cat}-${i}`;const checked=!!state.checkedItems[k];return`
      <div class="shop-item${checked?" checked":""}" onclick="toggleCheck('${k}')">
        <div style="display:flex;gap:10px;align-items:center">
          <div class="shop-check${checked?" checked":""}">${checked?"✓":""}</div>
          <span style="font-size:13px;text-decoration:${checked?"line-through":"none"}">${item}</span>
        </div>
        <span style="font-size:12px;color:#64748b">${qty}</span>
      </div>`;}).join('')}
    </div>`;
  });
  return html;
}

function renderProgress() {
  const log = state.progressLog;
  const startKg = log[0]?.weight||0;
  const currentKg = log[log.length-1]?.weight||startKg;
  const lostKg = startKg-currentKg;
  const STONE = 6.35;
  const pct = Math.min(100,Math.max(0,lostKg/STONE*100));
  const plan = state.plan;
  const totalKm = Object.values(plan.runs||{}).reduce((a,r)=>a+r.distance,0);

  let html = `<div class="card">
    <div class="lbl">Goal: Lose 1 stone (${STONE}kg)</div>
    <div style="margin-top:10px">
      <div style="display:flex;justify-content:space-between;font-size:12px;color:#64748b;margin-bottom:6px">
        <span>Progress to goal</span>
        <span style="color:#38bdf8;font-weight:700">${Math.max(0,lostKg).toFixed(1)}kg lost</span>
      </div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:#475569;margin-top:4px">
        <span>0kg</span><span>${pct.toFixed(0)}%</span><span>${STONE}kg</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="lbl">Log today's weight</div>
    <div style="display:flex;gap:8px;margin-top:10px;align-items:center">
      <input class="weight-input" type="number" id="weight-input" placeholder="e.g. 72.5" step="0.1">
      <span style="color:#64748b;font-size:13px">kg</span>
      <button class="btn-primary" onclick="logWeight()">Log</button>
    </div>
  </div>`;

  if (log.length>0) {
    html += `<div class="card"><div class="lbl">Weight log</div>
      ${[...log].reverse().map((entry,i,arr)=>{
        const prev=arr[i+1];const diff=prev?entry.weight-prev.weight:null;
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #1e293b;font-size:13px">
          <span style="color:#64748b">${entry.date}</span>
          <span style="font-weight:700">${entry.weight} kg</span>
          ${diff!==null?`<span style="color:${diff<0?"#10b981":"#f87171"};font-size:12px">${diff>0?"+":""}${diff.toFixed(1)} kg</span>`:"<span></span>"}
        </div>`;}).join('')}
    </div>`;
  }

  html += `<div class="card">
    <div class="lbl">${plan.weekLabel||'Week 1'} — Activity</div>
    <div class="grid2">
      ${[["Running",`${totalKm}km`,"this week"],["Lifting","2 sessions","Tue & Fri"],["Yoga","1 class","Thu 10am"],["Home","1 session","Sat ≤20 min"]].map(([l,v,s])=>`
      <div class="stat-card"><div class="big">${v}</div><div class="lbl">${l}</div><div style="font-size:10px;color:#475569;margin-top:2px">${s}</div></div>`).join('')}
    </div>
  </div>

  <div class="card">
    <div class="lbl">Tips for your 1-stone goal</div>
    ${["Aim for 0.5–1kg/week — sustainable & muscle-preserving","Hit 100–120g protein daily to protect muscle while losing fat","Drink 2–2.5L water daily — especially on run days","Yoga lowers cortisol — the stress hormone that causes belly fat","Sleep 7–8 hours — poor sleep raises hunger hormones by ~30%","Weigh weekly, same day & time, for accurate tracking"].map(t=>`
    <div style="display:flex;gap:8px;font-size:12px;color:#94a3b8;align-items:flex-start;margin-bottom:8px">
      <span style="color:#10b981;margin-top:1px;flex-shrink:0">→</span><span>${t}</span>
    </div>`).join('')}
  </div>

  <div class="card highlight">
    <div class="lbl">🔄 Update plan each Monday</div>
    <div style="font-size:13px;color:#94a3b8;line-height:1.7;margin-bottom:12px">
      Ask Claude for your new weekly plan — meals and workouts — then paste the JSON below. Everything updates at once.
    </div>
    <div style="background:#0f172a;border-radius:8px;padding:10px 14px;font-size:12px;color:#e2e8f0;font-style:italic;border-left:3px solid #38bdf8;margin-bottom:14px;line-height:1.6">
      "Generate my weekly fitness and meal plan as JSON for my app. Meals for Mercadona Spain — no tuna, no chickpeas, no lentil soup. Varied dinners, quick prep with longer oven time fine. Workouts: progressive weights (Option C), slow steady run increase, varied home workouts."
    </div>
    <button class="btn-primary" onclick="openModal()" style="width:100%;padding:13px;font-size:14px;border-radius:10px">📋 Paste new week's plan</button>
  </div>`;

  return html;
}

// ─── HANDLERS ────────────────────────────────────────────────────────────────
function attachHandlers() {
  const wi = document.getElementById('weight-input');
  if (wi) wi.addEventListener('keydown', e => { if (e.key==='Enter') logWeight(); });
}

function setDay(d) { state.activeDay=d; render(); }
function setHomeIdx(i) { state.homeIdx=i; renderContent(); }
function toggleSet(k) { state.completedSets[k]=!state.completedSets[k]; renderContent(); }
function toggleCheck(k) { state.checkedItems[k]=!state.checkedItems[k]; saveChecked(); renderContent(); }

function logWeight() {
  const input = document.getElementById('weight-input');
  const val = parseFloat(input?.value);
  if (!val) return;
  state.progressLog.push({date:new Date().toLocaleDateString('en-GB'),weight:val});
  saveProgress(); renderContent();
}

function copyList() {
  const grouped = buildShoppingList();
  const lines = [];
  Object.entries(grouped).forEach(([cat,items])=>{
    if (!items.length) return;
    items.forEach(({item,qty})=>lines.push(`${item} — ${qty}`));
  });
  navigator.clipboard.writeText(lines.join('\n')).then(()=>{
    const btn = document.getElementById('copy-btn');
    if (btn) { btn.textContent='✓ Copied!'; btn.classList.replace('btn-primary','btn-success'); setTimeout(()=>{ btn.textContent='📋 Copy list'; btn.classList.replace('btn-success','btn-primary'); },2500); }
  });
}

function openModal() { document.getElementById('update-modal').classList.add('open'); }
function closeModal() { document.getElementById('update-modal').classList.remove('open'); }

function applyUpdate() {
  // Strip markdown fences if present
  const raw = document.getElementById('update-textarea').value;
  const text = raw.replace(/```json/gi,'').replace(/```/g,'').trim();
  try {
    const parsed = JSON.parse(text);
    state.plan = Object.assign({}, DEFAULT_PLAN, parsed);
    if (parsed.meals) state.plan.meals = Object.assign({}, DEFAULT_PLAN.meals, parsed.meals);
    savePlan();
    state.completedSets = {};
    state.checkedItems = {};
    saveChecked();
    closeModal();
    document.getElementById('update-textarea').value = '';
    alert('Week updated! All fresh.');
    render();
  } catch(e) {
    alert('Error: ' + e.message);
  }
}


document.querySelectorAll('.tab-btn').forEach(b=>{
  b.addEventListener('click',()=>{ state.tab=b.dataset.tab; render(); });
});
document.getElementById('update-modal').addEventListener('click',e=>{
  if (e.target===e.currentTarget) closeModal();
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

render();
</script>
</body>
</html>
